# tests/kernel-pins.conf -- pinned kernel source tarballs for the test suite.
#
# Sourced shell file: pure variable assignments, no side effects, no
# downloads.  Read by tests/lib/kernel_cache.sh.
#
# The tarball names are exactly the ones the installers fetch:
#   https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-<version>.tar.xz
# (see install.cirrus.driver.sh and install.cirrus.driver.pre617.sh).
#
# SHA-256 values copied verbatim from kernel.org's signed checksum list:
#   https://cdn.kernel.org/pub/linux/kernel/v6.x/sha256sums.asc
# fetched 2026-10-07.
#
# PIN_NEW_VERSION is the newest 6.17.x (>= 6.17); PIN_OLD_VERSION is a recent
# 6.12.x LTS (< 6.17).

# New pin: 6.17 and newer -- the installer that also needs sound/hda.
PIN_NEW_VERSION="6.17.13"
PIN_NEW_TARBALL="linux-6.17.13.tar.xz"
PIN_NEW_SHA256="116802dc3ad1646163cc6ffe9bddba24a8069b569135ec0523cd799064f2edb9"

# Old pin: pre-6.17 -- the installer that only needs sound/pci/hda.
PIN_OLD_VERSION="6.12.112"
PIN_OLD_TARBALL="linux-6.12.112.tar.xz"
PIN_OLD_SHA256="164dc9d1f6c93c61a15e1f071c48379b467f2b17c469cce7223471968208ed03"
