name: deb

# Builds the snd-hda-macbookpro-dkms .deb with packaging/build-deb.sh, checks
# it, uploads it as an artifact and, on a v* tag push only, attaches it to
# the GitHub release.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "packaging/**"
      - "vendor/**"
      - "dkms.conf"
      - "install*.sh"

permissions:
  contents: read

concurrency:
  group: deb-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build deb
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A tag vX.Y.Z gives X.Y.Z; a PR build gets a throwaway pre-release
      # version. build-deb.sh rejects anything malformed.
      - name: Derive the package version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = push ]; then
            version=${REF_NAME#v}
          else
            version="0.0.0~ci${RUN_NUMBER}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build the package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          bash packaging/build-deb.sh --version "$VERSION" --out dist \
            --maintainer "snd-hda-macbookpro CI <noreply@users.noreply.github.com>"

      - name: Sanity-check the package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          deb="dist/snd-hda-macbookpro-dkms_${VERSION}_all.deb"
          root="./usr/src/snd_hda_macbookpro-${VERSION}"

          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb" | tee contents.txt
          paths=$(awk '{print $6}' contents.txt)

          for want in dkms.conf dkms.sh Makefile LICENSE \
              install.cirrus.driver.sh install.cirrus.driver.pre617.sh \
              makefiles/ patch_cirrus/ patches/ lib/ vendor/; do
            grep -Fxq "$root/$want" <<<"$paths" || { echo "missing from package: $want"; exit 1; }
          done
          if grep -Eq '/(tests|\.git|build|packaging)(/|$)|NOTES\.md' <<<"$paths"; then
            echo "package contains a path that must not ship:"
            grep -E '/(tests|\.git|build|packaging)(/|$)|NOTES\.md' <<<"$paths"
            exit 1
          fi

          dpkg-deb --fsys-tarfile "$deb" | tar -xOf - "$root/dkms.conf" \
            | grep -Fx "PACKAGE_VERSION=\"${VERSION}\""

          ctrl=$(mktemp -d)
          dpkg-deb --control "$deb" "$ctrl"
          sh -n "$ctrl/postinst"
          sh -n "$ctrl/prerm"

          if command -v lintian >/dev/null 2>&1; then
            lintian --fail-on error "$deb"
          else
            echo "lintian not installed on this runner; skipped"
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snd-hda-macbookpro-dkms-deb
          path: dist/*.deb
          if-no-files-found: error

  release:
    name: attach to release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: snd-hda-macbookpro-dkms-deb
          path: dist

      - name: Create the release if needed and upload the package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" dist/*.deb --clobber
